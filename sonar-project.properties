sonar.projectKey=whale-mix
sonar.projectName=Whale Mix
sonar.sourceEncoding=UTF-8
# Product and development source roots (the previous value pointed at a directory that does not exist).
sonar.sources=app/core,app/cli,app/gui,app/engine/src,app/training/whalemix_training,app/training/scripts
sonar.tests=app/tests,app/engine/tests,app/training/tests
sonar.exclusions=**/_trim.py,**/build/**,**/target/**,**/*.egg-info/**,**/resources/**
sonar.test.exclusions=**/data/*.json
sonar.python.version=3.13
sonar.python.coverage.reportPaths=app/training/coverage.xml
