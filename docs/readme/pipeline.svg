<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <rect width="980" height="360" fill="#0d1117"/>
  <style>
    .t { font-family: "Google Sans Code", "Geist Mono", ui-monospace, monospace; fill: #f6f8ff; }
    .l { font-family: "Google Sans Code", "Geist Mono", ui-monospace, monospace; fill: #94a3c4; }
    .box { fill: #11162a; stroke: #1e3fd8; stroke-width: 1; }
    .box2 { fill: #11162a; stroke: rgba(56,189,248,0.55); stroke-width: 1; }
    .line { stroke: rgba(56,189,248,0.45); stroke-width: 1.25; fill: none; }
    .hd { fill: #38bdf8; }
  </style>
  <text class="l" x="24" y="30" font-size="12" letter-spacing="2">DATA FLOW  ·  WHALE MIX</text>

  <!-- 1 source -->
  <rect class="box" x="24" y="140" width="150" height="88" rx="0"/>
  <text class="t" x="99" y="178" font-size="13" text-anchor="middle">Pacific Sound</text>
  <text class="l" x="99" y="198" font-size="10" text-anchor="middle">2 kHz recordings</text>
  <text class="l" x="99" y="214" font-size="10" text-anchor="middle">MBARI  ·  CC BY 4.0</text>

  <line class="line" x1="174" y1="184" x2="214" y2="184"/>
  <polygon points="214,184 206,180 206,188" fill="#38bdf8"/>

  <!-- 2 Blue A -->
  <rect class="box" x="214" y="140" width="160" height="88" rx="0"/>
  <text class="t" x="294" y="178" font-size="13" text-anchor="middle">Blue A</text>
  <text class="l" x="294" y="198" font-size="10" text-anchor="middle">25-second pictures</text>
  <text class="l" x="294" y="214" font-size="10" text-anchor="middle">bat  ·  baf</text>

  <line class="line" x1="374" y1="184" x2="414" y2="184"/>
  <polygon points="414,184 406,180 406,188" fill="#38bdf8"/>

  <!-- 3 Laya -->
  <rect class="box2" x="414" y="48" width="160" height="88" rx="0"/>
  <text class="t" x="494" y="86" font-size="13" text-anchor="middle">Laya</text>
  <text class="l" x="494" y="106" font-size="10" text-anchor="middle">one pass per row</text>
  <text class="l" x="494" y="122" font-size="10" text-anchor="middle">choice  ·  probability</text>

  <!-- connector Blue A to Laya and Mix -->
  <line class="line" x1="394" y1="184" x2="394" y2="92"/>
  <line class="line" x1="394" y1="92" x2="414" y2="92"/>
  <line class="line" x1="374" y1="184" x2="414" y2="184"/>

  <!-- 4 Mix -->
  <rect class="box" x="414" y="140" width="160" height="88" rx="0"/>
  <text class="t" x="494" y="178" font-size="13" text-anchor="middle">Mix rule</text>
  <text class="l" x="494" y="198" font-size="10" text-anchor="middle">agree  ·  under 0.6</text>
  <text class="l" x="494" y="214" font-size="10" text-anchor="middle">disagree → review</text>

  <line class="line" x1="574" y1="92" x2="594" y2="92"/>
  <line class="line" x1="594" y1="92" x2="594" y2="184"/>
  <line class="line" x1="574" y1="184" x2="634" y2="184"/>
  <polygon points="634,184 626,180 626,188" fill="#38bdf8"/>

  <!-- 5 piles -->
  <rect class="box2" x="634" y="40" width="140" height="56" rx="0"/>
  <text class="t" x="704" y="73" font-size="12" text-anchor="middle">call</text>

  <rect class="box2" x="634" y="108" width="140" height="56" rx="0"/>
  <text class="t" x="704" y="141" font-size="12" text-anchor="middle">not-call</text>

  <rect class="box2" x="634" y="176" width="140" height="56" rx="0"/>
  <text class="t" x="704" y="209" font-size="12" text-anchor="middle">review</text>

  <line class="line" x1="634" y1="184" x2="634" y2="68"/>
  <line class="line" x1="634" y1="68" x2="634" y2="204"/>
  <line class="line" x1="634" y1="68" x2="634" y2="68"/>

  <line class="line" x1="774" y1="68" x2="804" y2="68"/>
  <line class="line" x1="774" y1="136" x2="804" y2="136"/>
  <line class="line" x1="774" y1="204" x2="804" y2="204"/>
  <line class="line" x1="804" y1="68" x2="804" y2="204"/>
  <line class="line" x1="804" y1="184" x2="834" y2="184"/>
  <polygon points="834,184 826,180 826,188" fill="#38bdf8"/>

  <!-- 6 export -->
  <rect class="box" x="834" y="128" width="122" height="112" rx="0"/>
  <text class="t" x="895" y="162" font-size="13" text-anchor="middle">Export</text>
  <text class="l" x="895" y="182" font-size="10" text-anchor="middle">decisions.csv</text>
  <text class="l" x="895" y="198" font-size="10" text-anchor="middle">decisions.json</text>
  <text class="l" x="895" y="214" font-size="10" text-anchor="middle">pile manifests</text>
  <text class="l" x="895" y="230" font-size="10" text-anchor="middle">report.md</text>

  <text class="l" x="24" y="332" font-size="11">A row without Laya columns keeps Blue A&#8217;s label. Audio, pictures, weights, and score tables stay outside the repository.</text>
</svg>
