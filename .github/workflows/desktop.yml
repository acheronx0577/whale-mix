name: desktop

on:
  push:
    paths:
      - 'app/**'
      - 'samples/**'
      - 'packaging/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'samples/**'
      - 'packaging/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  windows:
    name: Windows (MSVC 2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtimageformats'
          cache: true

      - name: Configure CMake
        run: |
          cmake --preset windows-msvc -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        run: |
          cmake --build --preset windows-msvc-release

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --preset windows-msvc-release --output-on-failure

      - name: Generate Screenshot
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force screenshots
          & build/windows-msvc/app/Release/whale-mix.exe --screenshot screenshots/shot-windows.png --open samples/blue_a_scores.csv --select sample-a-004

      - name: Package Windows Zip and Installer
        run: |
          cmake --install build/windows-msvc --prefix dist/WhaleMix --config Release
          windeployqt --release --no-translations dist/WhaleMix/whale-mix.exe
          if (Test-Path dist/WhaleMix/include) { Remove-Item -Recurse -Force dist/WhaleMix/include }
          if (Test-Path dist/WhaleMix/lib) { Remove-Item -Recurse -Force dist/WhaleMix/lib }
          if (-not (Test-Path dist/WhaleMix/samples)) { Copy-Item -Recurse -Force samples dist/WhaleMix/samples }
          Compress-Archive -Path dist/WhaleMix -DestinationPath dist/WhaleMix-0.3.0-windows-x64.zip
          iscc /DAppVersion=0.3.0 packaging/whale-mix.iss

      - name: Upload Windows Zip
        uses: actions/upload-artifact@v4
        with:
          name: whale-mix-windows-zip
          path: dist/WhaleMix-0.3.0-windows-x64.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: whale-mix-windows-setup
          path: dist/WhaleMix-0.3.0-windows-x64-setup.exe
          retention-days: 7
          if-no-files-found: error

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots/
          retention-days: 7

  macos:
    name: macOS (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtimageformats'
          cache: true

      - name: Patch Qt AGL framework bug on macOS
        run: |
          QT_DIR="${{ env.Qt6_DIR }}"
          if [ -d "$QT_DIR/../../.." ]; then
            QT_ROOT="$(cd "$QT_DIR/../../.." && pwd)"
          else
            QT_ROOT="$QT_DIR"
          fi
          echo "Patching Qt AGL under $QT_ROOT"
          find "$QT_ROOT" -type f \( -name "*.cmake" -o -name "*.prl" \) -exec sed -i '' 's/-framework AGL//g' {} + 2>/dev/null || true
          find "$QT_ROOT" -type f -name "FindWrapOpenGL.cmake" -exec sed -i '' 's/find_library(WrapOpenGL_AGL NAMES AGL)/set(WrapOpenGL_AGL "")/g' {} + 2>/dev/null || true
          find "$QT_ROOT" -type f -name "FindWrapOpenGL.cmake" -exec sed -i '' 's/set(__opengl_agl_fw_path "-framework AGL")/set(__opengl_agl_fw_path "")/g' {} + 2>/dev/null || true
          mkdir -p /tmp/dummy_frameworks/AGL.framework
          clang -arch arm64 -arch x86_64 -shared -o /tmp/dummy_frameworks/AGL.framework/AGL -x c /dev/null -install_name @rpath/AGL.framework/AGL 2>/dev/null || true

      - name: Configure CMake
        run: |
          cmake --preset macos -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" -DCMAKE_FRAMEWORK_PATH="/tmp/dummy_frameworks" -DCMAKE_EXE_LINKER_FLAGS="-F/tmp/dummy_frameworks"

      - name: Build
        run: |
          cmake --build --preset macos-release

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --preset macos-release --output-on-failure

      - name: Generate Screenshot
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p screenshots
          "build/macos/app/Whale Mix.app/Contents/MacOS/Whale Mix" --screenshot screenshots/shot-macos.png --open samples/blue_a_scores.csv --select sample-a-004

      - name: Package DMG
        run: |
          chmod +x packaging/package-mac.sh
          ./packaging/package-mac.sh build/macos dist 0.3.0

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: whale-mix-macos-dmg
          path: dist/WhaleMix-0.3.0-macos.dmg
          retention-days: 7
          if-no-files-found: error

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: screenshots/
          retention-days: 7

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libfreetype6-dev ninja-build

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtimageformats'
          cache: true

      - name: Configure CMake
        run: |
          cmake --preset linux -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        run: |
          cmake --build --preset linux-release

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --preset linux-release --output-on-failure

      - name: Generate Screenshot
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p screenshots
          build/linux/app/whale-mix --screenshot screenshots/shot-linux.png --open samples/blue_a_scores.csv --select sample-a-004

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: screenshots/
          retention-days: 7

  integration:
    name: Integration (training + engine + fixture)
    runs-on: ubuntu-24.04
    env:
      # Fixture-dependent tests fail instead of skipping in this job.
      WHALEMIX_REQUIRE_FIXTURE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install training lock (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0 torchvision==0.29.2
          python -m pip install -r app/training/requirements-lock.txt

      - name: Python lint and types
        working-directory: app/training
        run: |
          ruff check .
          ruff format --check .
          mypy whalemix_training

      - name: Python tests
        working-directory: app/training
        run: |
          python -m pytest -q -rs --junitxml="$RUNNER_TEMP/pytest.xml"

      - name: Set up Rust 1.85.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.1'
          components: rustfmt, clippy

      - name: Rust format and lint
        working-directory: app/engine
        run: |
          cargo fmt --check
          cargo clippy --release --locked --all-targets -- -D warnings

      - name: Build engine
        working-directory: app/engine
        run: cargo build --release --locked

      - name: Export fixture bundle and parity reference (untrained, outside Git)
        working-directory: app/training
        run: |
          mkdir -p "$RUNNER_TEMP/fixture"
          printf '{"schema_version": 1, "paths": {"output_dir": "%s"}}\n' "$RUNNER_TEMP/fixture/out" > "$RUNNER_TEMP/fixture/config.json"
          python -m whalemix_training export --config "$RUNNER_TEMP/fixture/config.json" --fixture \
            --name fixture-b0 --parity-wav "$GITHUB_WORKSPACE/samples/sample-blue-whale-ne-pacific.wav" \
            | tee "$RUNNER_TEMP/fixture/export.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['validation_passed'], r" \
            "$RUNNER_TEMP/fixture/export.json"

      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libfreetype6-dev ninja-build

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtimageformats'
          cache: true

      - name: Configure CMake with engine tests and fixture paths
        run: |
          cmake --preset linux -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" \
            -DWHALEMIX_ENGINE_TESTS=ON -DWHALEMIX_REQUIRE_FIXTURE_TESTS=ON \
            -DWHALEMIX_TEST_ENGINE="$GITHUB_WORKSPACE/app/engine/target/release/whale-mix-engine" \
            -DWHALEMIX_TEST_FIXTURE_BUNDLE="$RUNNER_TEMP/fixture/out/fixture-bundles/fixture-b0" \
            -DWHALEMIX_TEST_PARITY_WAV="$GITHUB_WORKSPACE/samples/sample-blue-whale-ne-pacific.wav"

      - name: Build
        run: cmake --build --preset linux-release

      - name: CTest (GUI fixture, engine cargo tests, parity)
        run: |
          ctest --preset linux-release -V --output-on-failure 2>&1 | tee "$RUNNER_TEMP/ctest.log"
          exit "${PIPESTATUS[0]}"

      - name: Report skipped tests
        if: always()
        run: |
          {
            echo "## Skipped tests"
            if [ -f "$RUNNER_TEMP/pytest.xml" ]; then
              python - "$RUNNER_TEMP/pytest.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).getroot().iter("testcase")
          skipped = [(c.get("classname"), c.get("name"), c.find("skipped").get("message", "")) for c in cases if c.find("skipped") is not None]
          print(f"- pytest: {len(skipped)} skipped")
          for cls, name, msg in skipped:
              print(f"  - {cls}::{name}: {msg}")
          PY
            else
              echo "- pytest: did not run"
            fi
            if [ -f "$RUNNER_TEMP/ctest.log" ]; then
              n=$(grep -cE '\[  SKIPPED \] [A-Za-z]|skipped: |required fixture missing' "$RUNNER_TEMP/ctest.log" || true)
              echo "- ctest (gtest + cargo): $n skip lines"
              grep -E '\[  SKIPPED \] [A-Za-z]|skipped: |required fixture missing' "$RUNNER_TEMP/ctest.log" | sed 's/^/  - /' || true
            else
              echo "- ctest: did not run"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  verify-packages:
    name: Verify Required Packages
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Zip
        uses: actions/download-artifact@v4
        with:
          name: whale-mix-windows-zip
          path: dist/

      - name: Download Windows Setup
        uses: actions/download-artifact@v4
        with:
          name: whale-mix-windows-setup
          path: dist/

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: whale-mix-macos-dmg
          path: dist/

      - name: Verify All 3 Packages Exist and Non-Empty
        run: |
          ls -la dist/
          test -s dist/WhaleMix-0.3.0-windows-x64.zip
          test -s dist/WhaleMix-0.3.0-windows-x64-setup.exe
          test -s dist/WhaleMix-0.3.0-macos.dmg
          echo "All three required packages verified!"
