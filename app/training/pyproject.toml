[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whalemix-training"
version = "0.1.0"
description = "WhaleMix Acoustic v1 data contract, training, evaluation and export (development side only)."
requires-python = ">=3.11"
license = { text = "MIT" }
# Versions verified in the build environment on 2026-11-25; see requirements-lock.txt.
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "soundfile>=0.12",
]

[project.optional-dependencies]
model = ["torch>=2.5", "torchvision>=0.20", "onnx>=1.17", "onnxruntime>=1.20", "onnxscript>=0.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["whalemix_training*"]

[tool.setuptools.package-data]
whalemix_training = ["*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
