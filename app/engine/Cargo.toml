[package]
name = "whale-mix-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "WhaleMix Acoustic v1 offline inference worker (one background process per active analysis run)"
license = "MIT"
publish = false

[[bin]]
name = "whale-mix-engine"
path = "src/main.rs"

[dependencies]
hound = "3.5.1"
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "copy-dylibs"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
